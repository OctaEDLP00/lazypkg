name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        type: choice
        required: true
        default: 'patch'
        options:
          - minor
          - patch

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Latest Tag
        run: |
          latest_tag=$(git describe --tags $(git rev-list --tags --max-count=1) || echo "v0.0.0")

          if ! [[ $latest_tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag format is invalid. Expected format: vX.X.X"
            exit 1
          fi

          echo "Latest tag: $latest_tag"
          echo "latest_tag=$latest_tag" >> $GITHUB_ENV

      - name: Check for changes since last release
        env:
          LATEST_TAG: ${{ env.latest_tag }}
        run: |
          if [ -z "$(git diff --name-only "$LATEST_TAG")" ]; then
            echo "No changes detected since last release"
            exit 1
          fi

      - name: Calculate next version
        env:
          LATEST_TAG: ${{ env.latest_tag }}
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          echo "Latest tag: $LATEST_TAG"
          IFS='.' read -r major minor patch <<< "$LATEST_TAG"

          if [[ "$VERSION_BUMP" == "patch" ]]; then
            patch=$((patch + 1))
          else
            minor=$((minor + 1))
            patch=0
          fi

          new_tag="$major.$minor.$patch"

          if ! [[ $new_tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: New tag's format is invalid. Expected format: vX.X.X"
            exit 1
          fi

          echo "New tag: $new_tag"
          echo "new_tag=$new_tag" >> $GITHUB_ENV

      - name: Create and Push Tag
        env:
          NEW_TAG: ${{ env.new_tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG" -a -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
